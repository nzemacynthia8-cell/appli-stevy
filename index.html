<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STV - Streaming Vidéos YouTube</title>
  <meta name="description" content="STV est une application web de streaming et lecture de vidéos YouTube développée par BEZEZE Aimé Stevy.">
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #eee; margin: 0; }
    header.hero { text-align: center; position: relative; }
    .hero-img { width: 100%; height: 300px; object-fit: cover; filter: brightness(60%); }
    .hero-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; }
    .hero-text h1 { font-size: 3em; color: #ff6600; text-shadow: 2px 2px 8px #000; }
    .hero-text p { font-size: 1.2em; margin-bottom: 15px; }
    input, button { padding: 10px; margin: 5px; border-radius: 5px; border: none; }
    button { cursor: pointer; transition: background 0.3s ease; }

    #result {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .video-card {
      background: #1c1c1c;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .video-card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .video-card h3 {
      font-size: 16px;
      margin: 10px 0;
    }
    .video-card iframe {
      width: 100%;
      height: 180px;
      border-radius: 10px;
    }

    .youtube-link, .stv-link {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    .youtube-link { background: #ff0000; }
    .youtube-link:hover { background: #cc0000; }
    .stv-link { background: #000; }
    .stv-link:hover { background: #333; }

    footer {
      background: #111;
      padding: 15px;
      text-align: center;
      font-size: 0.9em;
      color: #aaa;
    }

    /* Loader animé */
    .loader {
      border: 6px solid #333;
      border-top: 6px solid #ff6600;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header class="hero">
    <img src="images/naruto.jpg" alt="Bannière Naruto STV" class="hero-img">
    <div class="hero-text">
      <h1>STV – Streaming Vidéos YouTube</h1>
      <p>Films, Extraits & Horreur</p>
      <input type="text" id="searchInput" placeholder="Rechercher une vidéo..." value="Naruto" aria-label="Champ de recherche vidéo">
      <button type="button" onclick="searchYouTube()" aria-label="Bouton rechercher vidéo">🔎 Rechercher</button>
    </div>
  </header>

  <main>
    <section class="video-container">
      <video autoplay muted loop controls width="560" height="315">
        <source src="videos/film.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo HTML5.
      </video>
    </section>

    <div id="result"></div>
  </main>

  <footer>
    <p>© 2026 STV - Streaming Vidéos YouTube</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
